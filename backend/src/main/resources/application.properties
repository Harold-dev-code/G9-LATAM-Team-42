spring.application.name=demo
# =========================================================
# CONFIGURACIÓN DE BASE DE DATOS EN MEMORIA (H2) - PRUEBAS LOCALES
# =========================================================
# Permite ejecutar y probar la persistencia e historial en entorno local sin requerir un servidor BD externo.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =========================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# =========================================================
# 'update' crea o actualiza las tablas automáticamente en la BD según las entidades @Entity definidas.
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola de IntelliJ las consultas SQL que Hibernate ejecuta (útil para depuración)
spring.jpa.show-sql=true